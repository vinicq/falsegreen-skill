name: release

# Builds the package and publishes it to npm via Trusted Publishing (OIDC).
# No long-lived NPM_TOKEN: the publish step exchanges a short-lived OIDC identity
# with the npm registry and attaches build provenance.
# Fires on a GitHub release being published, or manually for an existing tag.
#
# One-time human setup before the first run (see RELEASE.md):
#   1. npmjs.com: add a Trusted Publisher for package `falsegreen-skill`
#      (GitHub owner vinicq, repo falsegreen-skill, workflow release.yml).
#   2. The first publish of a brand-new package name may require an initial
#      manual `npm publish` to claim the name, depending on npm policy.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing (tokenless auth) needs npm >= 11.5.1, which ships
      # with Node >= 22.14. Node 20 ships npm 10, which signs provenance but cannot
      # authenticate via OIDC.
      - run: npm install -g npm@latest
      # Zero runtime/dev dependencies and no lockfile: the validate and smoke
      # scripts are pure Node, so there is nothing to `npm ci`.
      - run: npm run validate
      - run: npm test
      - name: Version parity (tag == package.json == CITATION == CHANGELOG)
        if: github.event_name == 'release'
        run: |
          v=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          cff=$(grep -m1 '^version:' CITATION.cff | cut -d' ' -f2)
          fail=0
          [ "$tag" = "$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} != package.json $v"; fail=1; }
          [ "$cff" = "$v" ] || { echo "::error::CITATION.cff $cff != package.json $v"; fail=1; }
          grep -qF "## [$v]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; fail=1; }
          [ "$fail" = 0 ] && echo "version parity OK: $v"
          exit $fail
      - name: Publish to npm (skip if the version is already published)
        env:
          # npm Automation token (Settings -> secrets -> NPM_TOKEN). Token auth is
          # the reliable path; --provenance still attaches OIDC build provenance.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "falsegreen-skill@$V" version >/dev/null 2>&1; then
            echo "falsegreen-skill@$V already on npm - skipping publish"
          else
            npm publish --provenance --access public
          fi
