# falsegreen-skill model tier routing
#
# Role: human-facing reference. Nothing in the package loads this file at
# runtime - the CLI keeps the package zero-dependency and ships its own model
# defaults, so adding a YAML parser to wire this in is out. Treat it as the
# canonical tier-to-model mapping that providers.md and the host contexts are
# validated against before a release (see CLAUDE.md "Default Model Guidance").
#
# Three tiers map analysis passes to model capability requirements.
# Pick the tier that matches the cases you are running.
#
# Temperature: the CLI defaults to 0.2 (--temperature flag). Passed to
# Anthropic and Gemini. OpenAI o-series (o3, o4-mini) do not accept a
# temperature parameter; the CLI omits it automatically for those models.

tiers:

  structural:
    description: >
      C1-C37 structural patterns. Pattern matching against well-defined AST signatures.
      Small models handle this tier reliably.
    cases: "C1-C37"
    minimum: "7B+ instruction model"
    rationale: "Pattern matching against well-defined structural signatures. Small models handle this reliably."
    models:
      anthropic: "claude-haiku-4-5"
      openai: "gpt-5-mini"
      google: "gemini-2.5-flash-lite"
      groq: "llama-3.3-70b-versatile"
      local: "qwen2.5-coder:7b"

  semantic:
    description: >
      Cases 10-15. Requires reasoning about test intent vs. what is actually tested.
      Frontier models or 70B+ local models are needed for reliable results.
    cases: "10-15"
    minimum: "Frontier model or 70B+ local"
    rationale: "Requires reasoning about test intent vs. what is tested. Smaller models produce high false-positive rates on these cases."
    models:
      anthropic: "claude-sonnet-5"
      openai: "gpt-5"
      google: "gemini-2.5-flash"
      groq: "llama-3.3-70b-versatile"
      local: "qwen2.5-coder:32b"

  adversarial:
    description: >
      Case 18 deep verification only. Runs a two-pass finder/refuter pipeline.
      Local models are not recommended because the refuter pass collapses on smaller
      models, producing unreliable HIGH confidence ratings.
    cases: "18"
    minimum: "Frontier model with extended reasoning support"
    rationale: "The adversarial refuter pass collapses on smaller models. Use the two-pass procedure documented in providers.md."
    models:
      anthropic: "claude-opus-4-8"
      openai: "gpt-5"           # use the reasoning-tier default your account exposes
      google: "gemini-2.5-pro"  # still active; scheduled sunset 2026-10-16, migrate before then
      local: "not recommended"
